name = "sudoku-turn"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# Token ID della TURN Server App (nella dashboard può comparire come
# "Token ID" o "App ID"): non è segreto, può stare qui
TURN_KEY_ID = ""

# Origine da cui viene aperto il gioco: schema e dominio, SENZA il percorso
# della pagina — il browser dichiara solo quello. Un eventuale percorso viene
# comunque ignorato. Vuoto = qualunque origine (sconsigliato).
ALLOWED_ORIGIN = "https://luiconsulting-bot.github.io"

# Durata delle credenziali, in secondi. Corta per scelta: sono pubbliche
# nel momento in cui raggiungono il browser.
TTL = "3600"

# L'API Token (o "App Secret") NON va qui. Si imposta come segreto:
#   npx wrangler secret put TURN_KEY_API_TOKEN

# Il database dello scambio automatico dei codici. Contiene solo stanze che
# durano un quarto d'ora: nessun dato di gioco, niente di personale.
# Dal pannello: Storage & Databases → D1 → Create, poi il collegamento qui
# sotto. La tabella se la crea il Worker da solo, al primo uso.
[[d1_databases]]
binding = "SCAMBIO"
database_name = "sudoku-scambio"
database_id = ""   # lo assegna Cloudflare quando crei il database
